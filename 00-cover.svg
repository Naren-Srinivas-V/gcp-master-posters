<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="800" fill="#16224F"/>
  <rect x="0" y="0" width="1200" height="6" fill="#00A896"/>

  <text x="600" y="90" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle" letter-spacing="4">A GCP LEARNING SERIES — VISUAL SUMMARY</text>
  <text x="600" y="140" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Understanding Google Cloud</text>
  <text x="600" y="178" font-size="20" fill="#CADCFC" text-anchor="middle">Seven chapters. One city. One mantra. Zero assumed knowledge.</text>

  <!-- mini city row -->
  <g font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <rect x="90" y="240" width="145" height="80" rx="12" fill="#16224F" stroke="#4285F4" stroke-width="1.5"/>
    <text x="162" y="275" fill="#FFFFFF">City Hall</text>
    <text x="162" y="292" font-size="9" font-weight="normal" fill="#BFD3FB">IAM · Ch.1</text>

    <rect x="255" y="240" width="145" height="80" rx="12" fill="#4285F4"/>
    <text x="327" y="275">Workshops</text>
    <text x="327" y="292" font-size="9" font-weight="normal" fill="#E8F0FE">Compute · Ch.2</text>

    <rect x="420" y="240" width="145" height="80" rx="12" fill="#00A896"/>
    <text x="492" y="275">Warehouses</text>
    <text x="492" y="292" font-size="9" font-weight="normal" fill="#DFF7EF">Storage &amp; DB · Ch.3</text>

    <rect x="585" y="240" width="145" height="80" rx="12" fill="#94A3E8"/>
    <text x="657" y="275" fill="#16224F">Roads</text>
    <text x="657" y="292" font-size="9" font-weight="normal" fill="#26306B">Networking · Ch.4</text>

    <rect x="750" y="240" width="145" height="80" rx="12" fill="#F96167"/>
    <text x="822" y="275">Factories</text>
    <text x="822" y="292" font-size="9" font-weight="normal" fill="#FFE4E6">Data &amp; AI · Ch.5</text>

    <rect x="915" y="240" width="195" height="80" rx="12" fill="#F59E0B"/>
    <text x="1012" y="275">Delivery Crew</text>
    <text x="1012" y="292" font-size="9" font-weight="normal" fill="#FEF3C7">DevOps/CI-CD · Ch.6</text>
  </g>

  <rect x="440" y="345" width="320" height="70" rx="12" fill="#1F2937"/>
  <text x="600" y="375" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Watchtower — Observability · Ch.7</text>
  <text x="600" y="393" font-size="10" fill="#A8A29E" text-anchor="middle">where this whole series began, and closes</text>

  <!-- divider -->
  <line x1="90" y1="450" x2="1110" y2="450" stroke="#2C3874" stroke-width="1.5"/>

  <!-- three pillars: why / how / mantra -->
  <text x="240" y="490" font-size="14" font-weight="bold" fill="#00A896" text-anchor="middle">WHY</text>
  <text x="240" y="515" font-size="12" fill="#CADCFC" text-anchor="middle">Rent exactly what</text>
  <text x="240" y="533" font-size="12" fill="#CADCFC" text-anchor="middle">you need, elastically</text>

  <text x="600" y="490" font-size="14" font-weight="bold" fill="#00A896" text-anchor="middle">HOW</text>
  <text x="600" y="515" font-size="12" fill="#CADCFC" text-anchor="middle">One request, one</text>
  <text x="600" y="533" font-size="12" fill="#CADCFC" text-anchor="middle">continuous, logged chain</text>

  <text x="960" y="490" font-size="14" font-weight="bold" fill="#00A896" text-anchor="middle">GOVERNING RULE</text>
  <text x="960" y="515" font-size="12" fill="#CADCFC" text-anchor="middle">Deny by default,</text>
  <text x="960" y="533" font-size="12" fill="#CADCFC" text-anchor="middle">verify every grant</text>

  <!-- mantra box -->
  <rect x="250" y="580" width="700" height="150" rx="20" fill="#00A896"/>
  <text x="600" y="620" font-size="15" fill="#16224F" text-anchor="middle" font-weight="bold">Deny by default. Grant the smallest thing that works.</text>
  <text x="600" y="645" font-size="15" fill="#16224F" text-anchor="middle" font-weight="bold">Prove it with a real test. Log everything, always.</text>
  <text x="600" y="680" font-size="12" fill="#0B4F44" text-anchor="middle" font-style="italic">The one idea behind all seven chapters</text>

  <text x="600" y="765" font-size="13" fill="#8B95BF" text-anchor="middle">gcp-master-posters — a plain-language and technical visual companion to the full series</text>
</svg>
