<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="800" fill="#F4F6FB"/>
  <rect x="0" y="0" width="1200" height="88" fill="#16224F"/>
  <text x="600" y="40" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle" letter-spacing="3">WHAT IS GCP, IN ONE PICTURE</text>
  <text x="600" y="70" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Think of it as a city — seven districts, one shared map</text>

  <!-- IAM: City Hall, top center -->
  <rect x="480" y="120" width="240" height="90" rx="14" fill="#16224F"/>
  <text x="600" y="150" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CITY HALL — IAM &amp; Security</text>
  <text x="600" y="170" font-size="10.5" fill="#CADCFC" text-anchor="middle">issues every badge (identity) and every</text>
  <text x="600" y="186" font-size="10.5" fill="#CADCFC" text-anchor="middle">permit (permission) — Chapter 1</text>

  <!-- Roads: Networking, connecting layer -->
  <rect x="60" y="250" width="1080" height="46" rx="10" fill="#94A3E8"/>
  <text x="600" y="278" font-size="13" fill="#16224F" text-anchor="middle" font-weight="bold">ROADS &amp; CHECKPOINTS — Networking: VPCs, subnets, firewalls, load balancers (Chapter 4)</text>

  <!-- District row 1 -->
  <rect x="60" y="330" width="250" height="130" rx="14" fill="#4285F4"/>
  <text x="185" y="365" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">OFFICE BUILDINGS</text>
  <text x="185" y="382" font-size="11" fill="#E8F0FE" text-anchor="middle">Compute</text>
  <text x="185" y="404" font-size="10" fill="#E8F0FE" text-anchor="middle">VMs, GKE, Cloud Run,</text>
  <text x="185" y="418" font-size="10" fill="#E8F0FE" text-anchor="middle">App Engine, Functions</text>
  <text x="185" y="440" font-size="9.5" fill="#BFD3FB" text-anchor="middle">Chapter 2</text>

  <rect x="335" y="330" width="250" height="130" rx="14" fill="#00A896"/>
  <text x="460" y="365" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">WAREHOUSES</text>
  <text x="460" y="382" font-size="11" fill="#FFFFFF" text-anchor="middle">Storage &amp; Databases</text>
  <text x="460" y="404" font-size="10" fill="#FFFFFF" text-anchor="middle">Cloud Storage, SQL, Firestore,</text>
  <text x="460" y="418" font-size="10" fill="#FFFFFF" text-anchor="middle">Spanner, Bigtable, BigQuery</text>
  <text x="460" y="440" font-size="9.5" fill="#CFF5EA" text-anchor="middle">Chapter 3</text>

  <rect x="610" y="330" width="250" height="130" rx="14" fill="#F96167"/>
  <text x="735" y="365" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">FACTORIES &amp; LABS</text>
  <text x="735" y="382" font-size="11" fill="#FFFFFF" text-anchor="middle">Data &amp; AI</text>
  <text x="735" y="404" font-size="10" fill="#FFFFFF" text-anchor="middle">Pub/Sub, Dataflow,</text>
  <text x="735" y="418" font-size="10" fill="#FFFFFF" text-anchor="middle">Dataproc, Vertex AI</text>
  <text x="735" y="440" font-size="9.5" fill="#FFD9DA" text-anchor="middle">Chapter 5</text>

  <rect x="885" y="330" width="255" height="130" rx="14" fill="#F59E0B"/>
  <text x="1012" y="365" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">THE ASSEMBLY LINE</text>
  <text x="1012" y="382" font-size="11" fill="#FFFFFF" text-anchor="middle">DevOps / CI-CD</text>
  <text x="1012" y="404" font-size="10" fill="#FFFFFF" text-anchor="middle">Cloud Build, Artifact Registry,</text>
  <text x="1012" y="418" font-size="10" fill="#FFFFFF" text-anchor="middle">Infrastructure as Code</text>
  <text x="1012" y="440" font-size="9.5" fill="#FEF3C7" text-anchor="middle">Chapter 6</text>

  <!-- watchtower -->
  <rect x="440" y="510" width="320" height="140" rx="16" fill="#1F2937"/>
  <polygon points="600,505 615,530 585,530" fill="#1F2937"/>
  <text x="600" y="548" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">THE WATCHTOWER</text>
  <text x="600" y="568" font-size="11" fill="#E7E5E4" text-anchor="middle">Observability &amp; Logging</text>
  <text x="600" y="592" font-size="10" fill="#D6D3D1" text-anchor="middle">sees every district at once — logs, metrics,</text>
  <text x="600" y="608" font-size="10" fill="#D6D3D1" text-anchor="middle">traces, alerts, error reports</text>
  <text x="600" y="630" font-size="9.5" fill="#A8A29E" text-anchor="middle">Chapter 7 — where this whole series began</text>

  <!-- connecting lines from watchtower up to districts -->
  <g stroke="#C7CBD9" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="500" y1="510" x2="185" y2="460"/>
    <line x1="540" y1="510" x2="460" y2="460"/>
    <line x1="660" y1="510" x2="735" y2="460"/>
    <line x1="700" y1="510" x2="1012" y2="460"/>
  </g>

  <text x="600" y="700" font-size="14" fill="#57534E" text-anchor="middle" font-style="italic">
    Every district is governed by City Hall's permits, connected by the same roads, and watched by the same tower.
  </text>
  <text x="600" y="724" font-size="14" fill="#57534E" text-anchor="middle" font-style="italic">
    That's the whole platform — not seven unrelated products, one connected city.
  </text>
</svg>
