<svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="640" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="88" fill="#16224F"/>
  <text x="600" y="40" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle" letter-spacing="3">HOW IT ALL WORKS TOGETHER</text>
  <text x="600" y="70" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">One user click, seven chapters working in sequence</text>

  <defs>
    <marker id="hArr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#16224F"/>
    </marker>
  </defs>

  <!-- step chain -->
  <g font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="90" cy="160" r="38" fill="#94A3E8"/>
    <text x="90" y="156" fill="#16224F">User</text>
    <text x="90" y="170" fill="#16224F">clicks</text>

    <circle cx="245" cy="160" r="38" fill="#94A3E8"/>
    <text x="245" y="156" fill="#16224F">Load</text>
    <text x="245" y="170" fill="#16224F">Balancer</text>
    <text x="245" y="205" font-weight="normal" fill="#57534E">Ch.4</text>

    <circle cx="400" cy="160" r="38" fill="#94A3E8"/>
    <text x="400" y="150" fill="#16224F">Firewall</text>
    <text x="400" y="165" fill="#16224F">checkpoint</text>
    <text x="400" y="205" font-weight="normal" fill="#57534E">Ch.4</text>

    <circle cx="555" cy="160" r="38" fill="#16224F"/>
    <text x="555" y="154" fill="#FFFFFF">IAM</text>
    <text x="555" y="168" fill="#FFFFFF">check</text>
    <text x="555" y="205" font-weight="normal" fill="#57534E">Ch.1</text>

    <circle cx="710" cy="160" r="38" fill="#4285F4"/>
    <text x="710" y="154" fill="#FFFFFF">Cloud Run</text>
    <text x="710" y="168" fill="#FFFFFF">executes</text>
    <text x="710" y="205" font-weight="normal" fill="#57534E">Ch.2</text>

    <circle cx="865" cy="160" r="38" fill="#00A896"/>
    <text x="865" y="154" fill="#FFFFFF">Reads</text>
    <text x="865" y="168" fill="#FFFFFF">Firestore</text>
    <text x="865" y="205" font-weight="normal" fill="#57534E">Ch.3</text>

    <circle cx="1020" cy="160" r="38" fill="#F59E0B"/>
    <text x="1020" y="154" fill="#FFFFFF">Event to</text>
    <text x="1020" y="168" fill="#FFFFFF">Pub/Sub</text>
    <text x="1020" y="205" font-weight="normal" fill="#57534E">Ch.5</text>
  </g>

  <g stroke="#16224F" stroke-width="2.5">
    <line x1="128" y1="160" x2="203" y2="160" marker-end="url(#hArr)"/>
    <line x1="283" y1="160" x2="358" y2="160" marker-end="url(#hArr)"/>
    <line x1="438" y1="160" x2="513" y2="160" marker-end="url(#hArr)"/>
    <line x1="593" y1="160" x2="668" y2="160" marker-end="url(#hArr)"/>
    <line x1="748" y1="160" x2="823" y2="160" marker-end="url(#hArr)"/>
    <line x1="903" y1="160" x2="978" y2="160" marker-end="url(#hArr)"/>
  </g>

  <!-- Denied branch -->
  <rect x="615" y="245" width="150" height="55" rx="10" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="690" y="268" font-size="11" fill="#B0293A" text-anchor="middle" font-weight="bold">Denied?</text>
  <text x="690" y="285" font-size="10" fill="#B0293A" text-anchor="middle">403 — stops here</text>
  <line x1="578" y1="188" x2="670" y2="240" stroke="#F96167" stroke-width="2" marker-end="url(#hArr)"/>

  <!-- everything logs to watchtower -->
  <rect x="330" y="400" width="540" height="130" rx="18" fill="#1F2937"/>
  <text x="600" y="440" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Every single step above writes to Cloud Logging</text>
  <text x="600" y="465" font-size="12" fill="#D6D3D1" text-anchor="middle">the IAM check, the deploy, the database read, the event — all of it</text>
  <text x="600" y="488" font-size="12" fill="#D6D3D1" text-anchor="middle">Observability &amp; Logging — Chapter 7</text>

  <g stroke="#A8A29E" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="555" y1="198" x2="470" y2="398"/>
    <line x1="710" y1="198" x2="560" y2="398"/>
    <line x1="865" y1="198" x2="660" y2="398"/>
    <line x1="1020" y1="198" x2="760" y2="398"/>
  </g>

  <!-- built by pipeline -->
  <rect x="20" y="400" width="270" height="130" rx="16" fill="#F59E0B"/>
  <text x="155" y="440" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">This whole chain of</text>
  <text x="155" y="458" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">services was deployed by</text>
  <text x="155" y="480" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">an automated pipeline</text>
  <text x="155" y="505" font-size="11" fill="#FEF3C7" text-anchor="middle">DevOps / CI-CD — Chapter 6</text>

  <text x="600" y="580" font-size="14" fill="#57534E" text-anchor="middle" font-style="italic">
    Seven chapters, one request. Nothing here is a separate system — it's one continuous handoff, start to finish.
  </text>
</svg>
