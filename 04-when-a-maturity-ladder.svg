<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="88" fill="#16224F"/>
  <text x="600" y="40" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle" letter-spacing="3">WHEN DO YOU ACTUALLY NEED EACH PIECE</text>
  <text x="600" y="70" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A maturity ladder, not a shopping list</text>

  <!-- baseline -->
  <line x1="80" y1="600" x2="1120" y2="600" stroke="#D6D3D1" stroke-width="3"/>

  <!-- Stage 1 -->
  <rect x="80" y="470" width="240" height="130" rx="14" fill="#0EA5E9"/>
  <text x="200" y="130" font-size="1"></text>
  <text x="200" y="500" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">STAGE 1</text>
  <text x="200" y="520" font-size="12" fill="#E0F2FE" text-anchor="middle">A solo project</text>
  <text x="200" y="545" font-size="10.5" fill="#E0F2FE" text-anchor="middle">Chapter 1 — IAM</text>
  <text x="200" y="562" font-size="10.5" fill="#E0F2FE" text-anchor="middle">Chapter 2 — Compute</text>
  <text x="200" y="579" font-size="10.5" fill="#E0F2FE" text-anchor="middle">Chapter 3 — Storage &amp; DB</text>

  <!-- Stage 2 -->
  <rect x="360" y="380" width="240" height="220" rx="14" fill="#10B981"/>
  <text x="480" y="410" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">STAGE 2</text>
  <text x="480" y="430" font-size="12" fill="#D1FAE5" text-anchor="middle">A real product, real users</text>
  <text x="480" y="458" font-size="10.5" fill="#D1FAE5" text-anchor="middle">+ Chapter 4 — Networking</text>
  <text x="480" y="475" font-size="9.5" fill="#A7F3D0" text-anchor="middle">private connections, firewalls,</text>
  <text x="480" y="490" font-size="9.5" fill="#A7F3D0" text-anchor="middle">a real load balancer</text>
  <text x="480" y="515" font-size="10.5" fill="#D1FAE5" text-anchor="middle">+ Chapter 5 — Data/AI</text>
  <text x="480" y="532" font-size="9.5" fill="#A7F3D0" text-anchor="middle">events, pipelines, maybe</text>
  <text x="480" y="547" font-size="9.5" fill="#A7F3D0" text-anchor="middle">your first ML model</text>

  <!-- Stage 3 -->
  <rect x="640" y="290" width="240" height="310" rx="14" fill="#F59E0B"/>
  <text x="760" y="320" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">STAGE 3</text>
  <text x="760" y="340" font-size="12" fill="#FEF3C7" text-anchor="middle">A team, shipping often</text>
  <text x="760" y="368" font-size="10.5" fill="#FEF3C7" text-anchor="middle">+ Chapter 6 — DevOps/CI-CD</text>
  <text x="760" y="385" font-size="9.5" fill="#FDE68A" text-anchor="middle">manual deploys don't scale</text>
  <text x="760" y="400" font-size="9.5" fill="#FDE68A" text-anchor="middle">past one person anymore</text>
  <text x="760" y="428" font-size="10.5" fill="#FEF3C7" text-anchor="middle">+ Deployment strategies</text>
  <text x="760" y="445" font-size="9.5" fill="#FDE68A" text-anchor="middle">canary, blue/green —</text>
  <text x="760" y="460" font-size="9.5" fill="#FDE68A" text-anchor="middle">real users, real risk now</text>

  <!-- Stage 4 -->
  <rect x="920" y="180" width="240" height="420" rx="14" fill="#1F2937"/>
  <text x="1040" y="210" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">STAGE 4</text>
  <text x="1040" y="230" font-size="12" fill="#E7E5E4" text-anchor="middle">Production-grade, at scale</text>
  <text x="1040" y="258" font-size="10.5" fill="#E7E5E4" text-anchor="middle">+ Chapter 7 — Observability</text>
  <text x="1040" y="275" font-size="9.5" fill="#D6D3D1" text-anchor="middle">you can't watch every request —</text>
  <text x="1040" y="290" font-size="9.5" fill="#D6D3D1" text-anchor="middle">dashboards and alerts watch for you</text>
  <text x="1040" y="318" font-size="10.5" fill="#E7E5E4" text-anchor="middle">+ SLOs &amp; error budgets</text>
  <text x="1040" y="335" font-size="9.5" fill="#D6D3D1" text-anchor="middle">reliability becomes a</text>
  <text x="1040" y="350" font-size="9.5" fill="#D6D3D1" text-anchor="middle">measured promise, not a hope</text>
  <text x="1040" y="378" font-size="10.5" fill="#E7E5E4" text-anchor="middle">+ Everything from Stages 1–3</text>
  <text x="1040" y="395" font-size="9.5" fill="#D6D3D1" text-anchor="middle">re-applied at scale, not</text>
  <text x="1040" y="410" font-size="9.5" fill="#D6D3D1" text-anchor="middle">replaced — the same patterns</text>

  <text x="600" y="650" font-size="14" fill="#57534E" text-anchor="middle" font-style="italic">
    Nothing here is skipped when you scale up — Stage 4 still uses Chapter 1's least-privilege IAM. Each stage ADDS, never replaces.
  </text>
</svg>
