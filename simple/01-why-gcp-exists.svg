<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="88" fill="#16224F"/>
  <text x="600" y="40" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle" letter-spacing="3">WHY DOES A PLATFORM LIKE GCP EXIST</text>
  <text x="600" y="70" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">From "buy it yourself" to "rent exactly what you need"</text>

  <!-- BEFORE column -->
  <rect x="40" y="120" width="540" height="560" rx="18" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="310" y="165" font-size="20" font-weight="bold" fill="#B0293A" text-anchor="middle">BEFORE: running your own servers</text>

  <g font-size="13" fill="#7A2331">
    <circle cx="80" cy="210" r="7" fill="#F96167"/>
    <text x="100" y="200" font-weight="bold" fill="#1F2937">Buy hardware upfront</text>
    <text x="100" y="220">Guess how much capacity you'll need — for years — before you have a single user.</text>

    <circle cx="80" cy="270" r="7" fill="#F96167"/>
    <text x="100" y="260" font-weight="bold" fill="#1F2937">Fixed capacity</text>
    <text x="100" y="280">Too little, and you crash during your busiest day. Too much, and it sits idle, still costing money.</text>

    <circle cx="80" cy="330" r="7" fill="#F96167"/>
    <text x="100" y="320" font-weight="bold" fill="#1F2937">You are the maintenance team</text>
    <text x="100" y="340">Patching, backups, physical failures, power, cooling — all your job, all the time.</text>

    <circle cx="80" cy="390" r="7" fill="#F96167"/>
    <text x="100" y="380" font-weight="bold" fill="#1F2937">Scaling means buying MORE boxes</text>
    <text x="100" y="400">A traffic spike means an emergency purchase order, not a slider you move.</text>

    <circle cx="80" cy="450" r="7" fill="#F96167"/>
    <text x="100" y="440" font-weight="bold" fill="#1F2937">One data center, one risk</text>
    <text x="100" y="460">A fire, a flood, a power cut in one building can take everything down.</text>

    <circle cx="80" cy="510" r="7" fill="#F96167"/>
    <text x="100" y="500" font-weight="bold" fill="#1F2937">Security is entirely on you</text>
    <text x="100" y="520">No shared responsibility model — every patch, every lock, every log, your team alone.</text>
  </g>

  <rect x="70" y="580" width="480" height="70" rx="12" fill="#FFFFFF" stroke="#F96167" stroke-width="1.5"/>
  <text x="310" y="612" font-size="13" font-weight="bold" fill="#B0293A" text-anchor="middle">Result: huge upfront cost, huge upfront risk,</text>
  <text x="310" y="632" font-size="13" font-weight="bold" fill="#B0293A" text-anchor="middle">before you've proven anything works.</text>

  <!-- arrow -->
  <defs>
    <marker id="arrH" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#16224F"/>
    </marker>
  </defs>
  <path d="M 588 400 L 645 400" stroke="#16224F" stroke-width="6" marker-end="url(#arrH)"/>

  <!-- WITH GCP column -->
  <rect x="620" y="120" width="540" height="560" rx="18" fill="#E1F5EE" stroke="#00A896" stroke-width="2"/>
  <text x="890" y="165" font-size="20" font-weight="bold" fill="#00695C" text-anchor="middle">WITH GCP: rent exactly what you use</text>

  <g font-size="13" fill="#0B4F44">
    <circle cx="660" cy="210" r="7" fill="#00A896"/>
    <text x="680" y="200" font-weight="bold" fill="#1F2937">Pay for what you use</text>
    <text x="680" y="220">Chapter 2's Cloud Run scaled to ZERO cost when idle — you saw this yourself.</text>

    <circle cx="660" cy="270" r="7" fill="#00A896"/>
    <text x="680" y="260" font-weight="bold" fill="#1F2937">Elastic capacity</text>
    <text x="680" y="280">Traffic spikes are handled automatically — Managed Instance Groups, Cloud Run, GKE Autopilot.</text>

    <circle cx="660" cy="330" r="7" fill="#00A896"/>
    <text x="680" y="320" font-weight="bold" fill="#1F2937">Google maintains the hardware</text>
    <text x="680" y="340">Shared Responsibility Model (Ch.1): Google handles physical, you handle config.</text>

    <circle cx="660" cy="390" r="7" fill="#00A896"/>
    <text x="680" y="380" font-weight="bold" fill="#1F2937">Scaling is a setting, not a truck</text>
    <text x="680" y="400">More capacity is a config change away, not a delivery date.</text>

    <circle cx="660" cy="450" r="7" fill="#00A896"/>
    <text x="680" y="440" font-weight="bold" fill="#1F2937">Global by default</text>
    <text x="680" y="460">Multi-region storage, global load balancing (Ch.3, Ch.4) — no buildings to own.</text>

    <circle cx="660" cy="510" r="7" fill="#00A896"/>
    <text x="680" y="500" font-weight="bold" fill="#1F2937">Security is a shared, structured system</text>
    <text x="680" y="520">IAM, audit logs, encryption by default (Ch.1) — a real framework, not "figure it out yourself."</text>
  </g>

  <rect x="650" y="580" width="480" height="70" rx="12" fill="#FFFFFF" stroke="#00A896" stroke-width="1.5"/>
  <text x="890" y="612" font-size="13" font-weight="bold" fill="#00695C" text-anchor="middle">Result: start tiny, pay for exactly what you use,</text>
  <text x="890" y="632" font-size="13" font-weight="bold" fill="#00695C" text-anchor="middle">and grow without ever re-architecting from scratch.</text>

  <text x="600" y="700" font-size="14" fill="#57534E" text-anchor="middle" font-style="italic">
    This is the "why" behind every chapter in this series — each one is a piece of that rented, elastic, shared-responsibility system.
  </text>
</svg>
