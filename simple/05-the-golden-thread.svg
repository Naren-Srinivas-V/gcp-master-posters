<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="1000" fill="#16224F"/>
  <text x="600" y="55" font-size="15" font-weight="bold" fill="#00A896" text-anchor="middle" letter-spacing="3">THE ONE IDEA BEHIND EVERY CHAPTER</text>
  <text x="600" y="92" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The Golden Thread</text>

  <!-- ring -->
  <circle cx="600" cy="570" r="340" fill="none" stroke="#4B5A9E" stroke-width="2" stroke-dasharray="2,8"/>

  <!-- center mantra -->
  <rect x="370" y="505" width="460" height="130" rx="20" fill="#00A896"/>
  <text x="600" y="542" font-size="14.5" fill="#16224F" text-anchor="middle" font-weight="bold">Deny by default.</text>
  <text x="600" y="565" font-size="14.5" fill="#16224F" text-anchor="middle" font-weight="bold">Grant the smallest thing that works.</text>
  <text x="600" y="588" font-size="14.5" fill="#16224F" text-anchor="middle" font-weight="bold">Prove it with a real test.</text>
  <text x="600" y="611" font-size="14.5" fill="#16224F" text-anchor="middle" font-weight="bold">Log everything, always.</text>

  <!-- 8 ring nodes -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="600" cy="230" r="60" fill="#4285F4"/>
    <text x="600" y="225" fill="#FFFFFF">Ch.1 IAM</text>
    <text x="600" y="242" font-size="9.5" font-weight="normal" fill="#E8F0FE">deny by default</text>

    <circle cx="840" cy="330" r="60" fill="#00A896"/>
    <text x="840" y="325" fill="#FFFFFF">Ch.2 Compute</text>
    <text x="840" y="342" font-size="9.5" font-weight="normal" fill="#E1F5EE">403 → 200, proven</text>

    <circle cx="940" cy="570" r="60" fill="#F96167"/>
    <text x="940" y="565" fill="#FFFFFF">Ch.3 Storage</text>
    <text x="940" y="582" font-size="9.5" font-weight="normal" fill="#FFE4E6">narrow grant, tested</text>

    <circle cx="840" cy="810" r="60" fill="#94A3E8"/>
    <text x="840" y="805" fill="#16224F">Ch.4 Network</text>
    <text x="840" y="822" font-size="9.5" font-weight="normal" fill="#1F2937">checkpoint by default</text>

    <circle cx="600" cy="910" r="60" fill="#EA580C"/>
    <text x="600" y="905" fill="#FFFFFF">Ch.5 Data/AI</text>
    <text x="600" y="922" font-size="9.5" font-weight="normal" fill="#FED7AA">scoped pipeline SAs</text>

    <circle cx="360" cy="810" r="60" fill="#059669"/>
    <text x="360" y="805" fill="#FFFFFF">Ch.6 DevOps</text>
    <text x="360" y="822" font-size="9.5" font-weight="normal" fill="#D1FAE5">highest-stakes SA</text>

    <circle cx="260" cy="570" r="60" fill="#F59E0B"/>
    <text x="260" y="565" fill="#FFFFFF">Ch.7 Observe</text>
    <text x="260" y="582" font-size="9.5" font-weight="normal" fill="#FEF3C7">proof, not assumption</text>

    <circle cx="360" cy="330" r="60" fill="#8B5CF6"/>
    <text x="360" y="325" fill="#FFFFFF">Every log</text>
    <text x="360" y="342" font-size="9.5" font-weight="normal" fill="#EDE9FE">entry, checked</text>
  </g>

  <text x="600" y="975" font-size="14" fill="#CADCFC" text-anchor="middle" font-style="italic">
    Different service, same four sentences, every single time. That repetition IS the skill this series teaches.
  </text>
</svg>
