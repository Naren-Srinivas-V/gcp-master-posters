<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="760" fill="#F4F6FB"/>
  <rect x="0" y="0" width="1200" height="100" fill="#16224F"/>
  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Imagine a City</text>
  <text x="600" y="75" font-size="15" fill="#CADCFC" text-anchor="middle">This is what "the cloud" actually is — just a well-organized city, running your app instead of shops</text>

  <!-- Guard: city hall top -->
  <rect x="470" y="130" width="260" height="100" rx="16" fill="#16224F"/>
  <text x="600" y="168" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Guard</text>
  <text x="600" y="190" font-size="11.5" fill="#CADCFC" text-anchor="middle">checks everyone's ID before</text>
  <text x="600" y="206" font-size="11.5" fill="#CADCFC" text-anchor="middle">letting them do anything at all</text>

  <!-- roads -->
  <rect x="60" y="270" width="1080" height="50" rx="12" fill="#94A3E8"/>
  <text x="600" y="301" font-size="14" fill="#16224F" text-anchor="middle" font-weight="bold">The Roads — carry traffic safely between every building, with checkpoints along the way</text>

  <!-- 4 districts -->
  <rect x="60" y="360" width="250" height="140" rx="16" fill="#4285F4"/>
  <text x="185" y="400" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Workshops</text>
  <text x="185" y="425" font-size="11.5" fill="#E8F0FE" text-anchor="middle">where the actual work</text>
  <text x="185" y="442" font-size="11.5" fill="#E8F0FE" text-anchor="middle">gets done, on demand</text>
  <text x="185" y="472" font-size="10" fill="#BFD3FB" text-anchor="middle">(runs your app)</text>

  <rect x="335" y="360" width="250" height="140" rx="16" fill="#00A896"/>
  <text x="460" y="400" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Storerooms</text>
  <text x="460" y="425" font-size="11.5" fill="#FFFFFF" text-anchor="middle">where everything is</text>
  <text x="460" y="442" font-size="11.5" fill="#FFFFFF" text-anchor="middle">kept, safely, for later</text>
  <text x="460" y="472" font-size="10" fill="#CFF5EA" text-anchor="middle">(holds your data)</text>

  <rect x="610" y="360" width="250" height="140" rx="16" fill="#F96167"/>
  <text x="735" y="400" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Factories</text>
  <text x="735" y="425" font-size="11.5" fill="#FFFFFF" text-anchor="middle">where raw information</text>
  <text x="735" y="442" font-size="11.5" fill="#FFFFFF" text-anchor="middle">gets turned into insight</text>
  <text x="735" y="472" font-size="10" fill="#FFD9DA" text-anchor="middle">(processes &amp; learns from data)</text>

  <rect x="885" y="360" width="255" height="140" rx="16" fill="#F59E0B"/>
  <text x="1012" y="400" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Delivery Crew</text>
  <text x="1012" y="425" font-size="11.5" fill="#FFFFFF" text-anchor="middle">builds and delivers new</text>
  <text x="1012" y="442" font-size="11.5" fill="#FFFFFF" text-anchor="middle">updates, automatically</text>
  <text x="1012" y="472" font-size="10" fill="#FEF3C7" text-anchor="middle">(ships new versions)</text>

  <!-- watchtower -->
  <rect x="440" y="550" width="320" height="120" rx="18" fill="#1F2937"/>
  <text x="600" y="588" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Watchtower</text>
  <text x="600" y="612" font-size="11.5" fill="#E7E5E4" text-anchor="middle">keeps an eye on the whole city,</text>
  <text x="600" y="629" font-size="11.5" fill="#E7E5E4" text-anchor="middle">all day, and writes down everything</text>
  <text x="600" y="650" font-size="10" fill="#A8A29E" text-anchor="middle">(logs &amp; alerts)</text>

  <text x="600" y="720" font-size="15" fill="#57534E" text-anchor="middle" font-style="italic">
    That's it. Not magic — just a well-run city, and you're renting a few buildings in it.
  </text>
</svg>
