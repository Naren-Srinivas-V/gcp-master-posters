<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="100" fill="#16224F"/>
  <text x="600" y="45" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">It Works Like Ordering a Pizza</text>
  <text x="600" y="75" font-size="15" fill="#CADCFC" text-anchor="middle">Every single thing your app does follows this same simple chain</text>

  <defs>
    <marker id="sArr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#16224F"/>
    </marker>
  </defs>

  <g font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <circle cx="110" cy="240" r="55" fill="#94A3E8"/>
    <text x="110" y="235" fill="#16224F">You call</text>
    <text x="110" y="251" fill="#16224F">to order</text>

    <circle cx="330" cy="240" r="55" fill="#16224F"/>
    <text x="330" y="235">"Is this a real</text>
    <text x="330" y="251">customer?"</text>

    <circle cx="550" cy="240" r="55" fill="#4285F4"/>
    <text x="550" y="235">The kitchen</text>
    <text x="550" y="251">gets to work</text>

    <circle cx="770" cy="240" r="55" fill="#00A896"/>
    <text x="770" y="235">Grabs the</text>
    <text x="770" y="251">ingredients</text>

    <circle cx="990" cy="240" r="55" fill="#F59E0B"/>
    <text x="990" y="235">Delivered</text>
    <text x="990" y="251">to your door</text>
  </g>

  <g stroke="#16224F" stroke-width="3">
    <line x1="168" y1="240" x2="272" y2="240" marker-end="url(#sArr)"/>
    <line x1="388" y1="240" x2="492" y2="240" marker-end="url(#sArr)"/>
    <line x1="608" y1="240" x2="712" y2="240" marker-end="url(#sArr)"/>
    <line x1="828" y1="240" x2="932" y2="240" marker-end="url(#sArr)"/>
  </g>

  <g font-size="10.5" fill="#78716C" text-anchor="middle">
    <text x="110" y="312">the Roads</text>
    <text x="330" y="312">the Guard</text>
    <text x="550" y="312">the Workshop</text>
    <text x="770" y="312">the Storeroom</text>
    <text x="990" y="312">the Roads again</text>
  </g>

  <!-- refused branch -->
  <rect x="270" y="350" width="180" height="60" rx="12" fill="#FBEAF0" stroke="#F96167" stroke-width="2"/>
  <text x="360" y="375" font-size="12" fill="#B0293A" text-anchor="middle" font-weight="bold">Not a real customer?</text>
  <text x="360" y="393" font-size="11" fill="#B0293A" text-anchor="middle">Call refused. Nothing happens.</text>
  <line x1="330" y1="295" x2="345" y2="345" stroke="#F96167" stroke-width="2.5" marker-end="url(#sArr)"/>

  <!-- watchtower note -->
  <rect x="700" y="350" width="320" height="90" rx="14" fill="#1F2937"/>
  <text x="860" y="378" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">The Watchtower writes EVERY step down</text>
  <text x="860" y="398" font-size="11" fill="#D6D3D1" text-anchor="middle">the call, the check, the cooking, the delivery —</text>
  <text x="860" y="415" font-size="11" fill="#D6D3D1" text-anchor="middle">so anyone can see exactly what happened, later</text>

  <text x="600" y="500" font-size="15" fill="#57534E" text-anchor="middle" font-style="italic">
    Nothing here is complicated on its own. It's just a chain of ordinary, careful steps — done automatically, every time.
  </text>
</svg>
