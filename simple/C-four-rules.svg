<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="620" fill="#16224F"/>
  <text x="600" y="55" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The Four Rules Behind All of It</text>
  <text x="600" y="85" font-size="15" fill="#CADCFC" text-anchor="middle">The same common sense you'd use for your own front door</text>

  <!-- 4 cards -->
  <rect x="60" y="140" width="520" height="200" rx="18" fill="#00A896"/>
  <text x="90" y="180" font-size="17" fill="#16224F" text-anchor="start" font-weight="bold">1. Don't trust a stranger by default</text>
  <text x="90" y="210" font-size="13" fill="#0B4F44" text-anchor="start">If someone knocks on your door, you check who it is FIRST —</text>
  <text x="90" y="230" font-size="13" fill="#0B4F44" text-anchor="start">you don't let them in automatically and ask questions later.</text>
  <text x="90" y="260" font-size="12" fill="#0B4F44" text-anchor="start" font-style="italic">Every part of this city works the exact same way.</text>

  <rect x="620" y="140" width="520" height="200" rx="18" fill="#4285F4"/>
  <text x="650" y="180" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">2. Hand out the smallest key that works</text>
  <text x="650" y="210" font-size="13" fill="#E8F0FE" text-anchor="start">A dog-sitter gets a key to your house — not your car,</text>
  <text x="650" y="230" font-size="13" fill="#E8F0FE" text-anchor="start">not your office, not a master key to everything you own.</text>
  <text x="650" y="260" font-size="12" fill="#E8F0FE" text-anchor="start" font-style="italic">Give exactly what's needed. Nothing extra, "just in case."</text>

  <rect x="60" y="360" width="520" height="200" rx="18" fill="#F96167"/>
  <text x="90" y="400" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">3. Actually test the lock</text>
  <text x="90" y="430" font-size="13" fill="#FFE4E6" text-anchor="start">Don't just assume a lock works — try the wrong key too,</text>
  <text x="90" y="450" font-size="13" fill="#FFE4E6" text-anchor="start">and make sure it's actually refused, not just "probably fine."</text>
  <text x="90" y="480" font-size="12" fill="#FFE4E6" text-anchor="start" font-style="italic">A rule you never tested is just a guess.</text>

  <rect x="620" y="360" width="520" height="200" rx="18" fill="#F59E0B"/>
  <text x="650" y="400" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="bold">4. Write down who came and went</text>
  <text x="650" y="430" font-size="13" fill="#FEF3C7" text-anchor="start">Like a visitor logbook — if something ever goes wrong,</text>
  <text x="650" y="450" font-size="13" fill="#FEF3C7" text-anchor="start">you can always look back and see exactly what happened.</text>
  <text x="650" y="480" font-size="12" fill="#FEF3C7" text-anchor="start" font-style="italic">Nothing happens invisibly.</text>

  <text x="600" y="600" font-size="14" fill="#CADCFC" text-anchor="middle" font-style="italic">
    That's genuinely the whole idea. Everything technical in this series is just these four rules, applied carefully.
  </text>
</svg>
